<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ask Away</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f2f2f2;
  margin: 0;
  padding: 20px;
}

.container {
  max-width: 550px;
  margin: 20px auto;
  background: white;
  padding: 40px 25px;
  border-radius: 30px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.12);
  text-align: center;
}

h1 {
  font-size: 58px;
  margin: 20px 0;
  color: #000;
}

.subtitle {
  font-size: 24px;
  color: #666;
  margin-bottom: 40px;
}

textarea {
  width: 100%;
  height: 180px;
  box-sizing: border-box;
  padding: 20px;
  font-size: 24px;
  border: 2px solid #ddd;
  border-radius: 20px;
  resize: vertical;
}

button {
  border: none;
  border-radius: 30px;
  padding: 18px 35px;
  font-size: 24px;
  cursor: pointer;
  margin-top: 25px;
}

#micButton {
  background: #ddd;
  color: #111;
}

#askButton {
  background: #111;
  color: white;
  display: block;
  margin: 25px auto 0;
}

#answer {
  margin-top: 40px;
  padding: 25px;
  background: #f5f5f5;
  border-radius: 20px;
  text-align: left;
  font-size: 23px;
  line-height: 1.5;
  min-height: 30px;
}

.loading {
  opacity: 0.6;
}

@media (max-width: 600px) {
  h1 {
    font-size: 52px;
  }

  .subtitle {
    font-size: 22px;
  }

  textarea {
    font-size: 21px;
  }

  #answer {
    font-size: 21px;
  }
}
</style>
</head>

<body>

<div class="container">

  <h1>Ask Away</h1>

  <div class="subtitle">
    Ask anything by text or voice.
  </div>

  <textarea id="question" placeholder="Type your question here..."></textarea>

  <button id="micButton">🎤 Speak</button>

  <button id="askButton">Ask Away</button>

  <div id="answer"></div>

</div>

<script>

const questionBox = document.getElementById("question");
const askButton = document.getElementById("askButton");
const answerBox = document.getElementById("answer");
const micButton = document.getElementById("micButton");

askButton.addEventListener("click", async () => {

  const question = questionBox.value.trim();

  if (!question) {
    answerBox.textContent = "Please enter a question.";
    return;
  }

  answerBox.textContent = "Thinking...";
  answerBox.classList.add("loading");

  try {

    const response = await fetch("/api/ask", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        question: question
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "Something went wrong.");
    }

    let answer = data.answer || "I didn't receive an answer.";

    // Remove common Markdown bold formatting
    answer = answer.replace(/\*\*(.*?)\*\*/g, "$1");

    answerBox.textContent = answer;

  } catch (error) {

    answerBox.textContent = "Sorry, something went wrong.";

  } finally {

    answerBox.classList.remove("loading");

  }

});


const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;

if (SpeechRecognition) {

  const recognition = new SpeechRecognition();

  recognition.lang = "en-IE";
  recognition.continuous = false;
  recognition.interimResults = false;

  micButton.addEventListener("click", () => {

    recognition.start();

    micButton.textContent = "🎙️ Listening...";

  });

  recognition.onresult = (event) => {

    const transcript =
      event.results[0][0].transcript;

    questionBox.value = transcript;

    micButton.textContent = "🎤 Speak";

  };

  recognition.onerror = () => {

    micButton.textContent = "🎤 Speak";

  };

  recognition.onend = () => {

    micButton.textContent = "🎤 Speak";

  };

} else {

  micButton.style.display = "none";

}

</script>

</body>
</html>
