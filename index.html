<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#07111f">
<link rel="manifest" href="/manifest.json">
<title>Ask Away</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
min-height:100vh;
font-family:Arial,Helvetica,sans-serif;
background:radial-gradient(circle at top,#12345a 0%,#07111f 45%,#02060b 100%);
color:white;
display:flex;
justify-content:center;
align-items:flex-start;
}

.app{
width:100%;
max-width:650px;
min-height:100vh;
padding:28px 20px 40px;
text-align:center;
}

.logo{
width:105px;
height:105px;
margin:5px auto 18px;
border-radius:30px;
background:linear-gradient(145deg,#20d9ff,#5140ff);
display:flex;
align-items:center;
justify-content:center;
font-size:52px;
font-weight:900;
box-shadow:0 0 35px rgba(32,217,255,.35);
}

h1{
margin:0;
font-size:52px;
line-height:1;
font-weight:900;
letter-spacing:-2px;
}

h1 span{color:#20d9ff}

.subtitle{
margin:16px auto 25px;
max-width:450px;
font-size:20px;
line-height:1.45;
color:#ebb0d0;
}

.card{
background:rgba(255,255,255,.07);
border:1px solid rgba(255,255,255,.13);
border-radius:28px;
padding:18px;
box-shadow:0 20px 45px rgba(0,0,0,.35);
backdrop-filter:blur(12px);
}

textarea{
width:100%;
height:170px;
resize:none;
border:2px solid rgba(255,255,255,.18);
border-radius:22px;
padding:20px;
background:#fff;
color:#111827;
font-size:20px;
outline:none;
font-family:Arial,Helvetica,sans-serif;
}

textarea:focus{border-color:#20d9ff}

button{
width:100%;
border:0;
border-radius:18px;
padding:17px;
margin-top:13px;
font-size:19px;
font-weight:800;
cursor:pointer;
}

.ask{
background:#14283d;
color:#20d9ff;
border:1px solid #28506f;
}

.ask:disabled{
opacity:.6;
cursor:wait;
}

.mic{
margin:12px auto;
width:58px;
height:58px;
padding:0;
border-radius:50%;
background:#07111f;
color:#20d9ff;
border:2px solid #20d9ff;
font-size:24px;
display:flex;
align-items:center;
justify-content:center;
}

.mic.listening{
animation:pulse 1.2s infinite;
}

@keyframes pulse{
0%{box-shadow:0 0 0 0 rgba(32,217,255,.35)}
50%{box-shadow:0 0 0 15px rgba(32,217,255,.04)}
100%{box-shadow:0 0 0 0 rgba(32,217,255,0)}
}

.status{
margin-top:14px;
font-size:14px;
color:#9fb3c8;
min-height:20px;
}

.answer{
display:none;
margin-top:20px;
padding:22px;
border-radius:22px;
background:#f8fafc;
color:#111827;
text-align:left;
font-size:18px;
line-height:1.6;
white-space:pre-wrap;
box-shadow:0 10px 30px rgba(0,0,0,.15);
}

.answer.show{display:block}

.answer-title{
font-weight:900;
color:#14283d;
margin-bottom:12px;
font-size:20px;
}

.tools{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
margin-top:12px;
}

.tools button{
margin-top:0;
background:#111f30;
color:white;
border:1px solid #29425e;
font-size:16px;
}

.main-tools{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
margin-top:12px;
}

.main-tools button{margin-top:0}

.history-section{
display:none;
margin-top:20px;
text-align:left;
}

.history-section.show{display:block}

.history-header{
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
margin-bottom:12px;
}

.history-title{
font-size:21px;
font-weight:900;
}

.clear-history{
width:auto;
margin:0;
padding:10px 14px;
font-size:13px;
background:#31151b;
color:#ffb5bd;
border:1px solid #69303a;
}

.history-item{
background:#f8fafc;
color:#111827;
border-radius:18px;
padding:16px;
margin-top:12px;
}

.history-question{
font-weight:900;
font-size:16px;
margin-bottom:9px;
}

.history-answer{
font-size:15px;
line-height:1.5;
white-space:pre-wrap;
}

.history-date{
margin-top:10px;
font-size:12px;
color:#718096;
}

.empty-history{
color:#9fb3c8;
text-align:center;
padding:18px 5px;
}

.footer{
margin-top:22px;
font-size:13px;
color:#718096;
}
</style>
</head>

<body>

<div class="app">

<div class="logo">?</div>

<h1>Ask <span>Away</span></h1>

<div class="subtitle">
Ask anything. Get clear answers.
</div>

<div class="card">

<textarea
id="question"
placeholder="What would you like to ask?"
></textarea>

<button class="mic" id="micButton" type="button">
🎙️
</button>

<button class="ask" id="askButton" type="button">
ASK AWAY
</button>

<div class="status" id="status"></div>

<div class="answer" id="answer">

<div class="answer-title">
Answer
</div>

<div id="answerText"></div>

</div>

<div class="tools">

<button id="speakButton" type="button">
🔊 Read Answer
</button>

<button id="clearButton" type="button">
✕ Clear
</button>

</div>

<div class="main-tools">

<button id="newConversationButton" type="button">
🆕 New Conversation
</button>

<button id="historyButton" type="button">
📜 History
</button>

</div>

<div class="history-section" id="historySection">

<div class="history-header">

<div class="history-title">
Conversation History
</div>

<button
class="clear-history"
id="clearHistoryButton"
type="button"
>
🗑️ Clear History
</button>

</div>

<div id="historyList"></div>

</div>

</div>

<div class="footer">
Ask Away — your AI assistant
</div>

</div>

<script>

const questionBox =
document.getElementById("question");

const askButton =
document.getElementById("askButton");

const micButton =
document.getElementById("micButton");

const answerBox =
document.getElementById("answer");

const answerText =
document.getElementById("answerText");

const statusBox =
document.getElementById("status");

const speakButton =
document.getElementById("speakButton");

const clearButton =
document.getElementById("clearButton");

const newConversationButton =
document.getElementById("newConversationButton");

const historyButton =
document.getElementById("historyButton");

const historySection =
document.getElementById("historySection");

const historyList =
document.getElementById("historyList");

const clearHistoryButton =
document.getElementById("clearHistoryButton");


/* STATUS */

function setStatus(message){
statusBox.textContent=message;
}


/* SPEAK ANSWER */

function speakAnswer(){

const text=answerText.textContent.trim();

if(!text){
setStatus("There is no answer to read yet.");
return;
}

if(!("speechSynthesis" in window)){
setStatus("Speech is not supported.");
return;
}

window.speechSynthesis.cancel();

const speech=
new SpeechSynthesisUtterance(text);

speech.lang="en-IE";
speech.rate=1;
speech.pitch=1;

window.speechSynthesis.speak(speech);

}


/* HISTORY */

function getHistory(){

try{

const saved=
localStorage.getItem("askAwayHistory");

if(!saved){
return [];
}

return JSON.parse(saved);

}catch(error){

console.error(error);
return [];

}

}


function saveHistory(history){

try{

localStorage.setItem(
"askAwayHistory",
JSON.stringify(history)
);

}catch(error){

console.error(error);

}

}


function addToHistory(question,answer){

const history=getHistory();

history.unshift({

question:question,
answer:answer,
date:new Date().toLocaleString("en-IE")

});

saveHistory(history);
renderHistory();

}


function renderHistory(){

const history=getHistory();

historyList.innerHTML="";

if(history.length===0){

historyList.innerHTML=
'<div class="empty-history">No conversations saved yet.</div>';

return;

}

history.forEach(function(item){

const box=
document.createElement("div");

box.className="history-item";

const q=
document.createElement("div");

q.className="history-question";
q.textContent="You: "+item.question;

const a=
document.createElement("div");

a.className="history-answer";
a.textContent=item.answer;

const d=
document.createElement("div");

d.className="history-date";
d.textContent=item.date;

box.appendChild(q);
box.appendChild(a);
box.appendChild(d);

historyList.appendChild(box);

});

}


/* ASK AI */

async function askAway(){

const question=
questionBox.value.trim();

if(!question){

setStatus("Please type a question first.");
questionBox.focus();
return;

}

askButton.disabled=true;
askButton.textContent="THINKING...";
setStatus("Thinking...");

answerBox.classList.remove("show");
answerText.textContent="";

try{

const response=
await fetch("/api/ask",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
question:question
})

});

if(!response.ok){
throw new Error("Request failed");
}

const data=
await response.json();

const answer=
data.answer ||
data.response ||
data.message ||
"No answer was returned.";

answerText.textContent=answer;

answerBox.classList.add("show");

setStatus("Ready.");

addToHistory(question,answer);

}catch(error){

console.error(error);

answerText.textContent=
"Sorry, something went wrong.";

answerBox.classList.add("show");

setStatus("Could not get an answer.");

}

askButton.disabled=false;
askButton.textContent="ASK AWAY";

}


/* MICROPHONE */

let recognition=null;

const SpeechRecognitionAPI=
window.SpeechRecognition ||
window.webkitSpeechRecognition;

if(SpeechRecognitionAPI){

recognition=
new SpeechRecognitionAPI();

recognition.lang="en-IE";
recognition.continuous=false;
recognition.interimResults=false;

recognition.onstart=function(){

micButton.classList.add("listening");
setStatus("Listening...");

};

recognition.onresult=function(event){

const transcript=
event.results[0][0].transcript;

questionBox.value=transcript;

setStatus("Ready
