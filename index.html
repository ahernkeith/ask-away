<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#07111f">
<link rel="manifest" href="/manifest.json">
<title>Ask Away</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  font-family:Arial,Helvetica,sans-serif;
  background:
    radial-gradient(circle at top,#12345a 0%,#07111f 45%,#02060b 100%);
  color:white;
  display:flex;
  justify-content:center;
}

.app{
  width:100%;
  max-width:650px;
  min-height:100vh;
  padding:28px 20px 35px;
  text-align:center;
}

.logo{
  width:105px;
  height:105px;
  margin:5px auto 18px;
  border-radius:30px;
  background:linear-gradient(145deg,#20d9ff,#5140ff);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:65px;
  font-weight:900;
  box-shadow:0 0 35px rgba(32,217,255,.35);
}

h1{
  margin:0;
  font-size:52px;
  line-height:1;
  font-weight:900;
  letter-spacing:-2px;
}

h1 span{
  color:#20d9ff;
}

.subtitle{
  margin:16px auto 25px;
  max-width:450px;
  font-size:20px;
  line-height:1.45;
  color:#aebbd0;
}

.card{
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.13);
  border-radius:28px;
  padding:18px;
  box-shadow:0 20px 45px rgba(0,0,0,.35);
  backdrop-filter:blur(12px);
}

textarea{
  width:100%;
  height:170px;
  resize:none;
  border:2px solid rgba(255,255,255,.18);
  border-radius:22px;
  padding:20px;
  background:#ffffff;
  color:#111827;
  font-size:20px;
  outline:none;
}

textarea:focus{
  border-color:#20d9ff;
}

button{
  width:100%;
  border:0;
  border-radius:18px;
  padding:17px;
  margin-top:13px;
  font-size:19px;
  font-weight:800;
  cursor:pointer;
}

.mic{
  background:#14283d;
  color:#20d9ff;
  border:1px solid #28506f;
}

.ask{
  background:linear-gradient(90deg,#20d9ff,#5747ff);
  color:white;
  box-shadow:0 8px 25px rgba(32,217,255,.25);
}

.tools{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-top:12px;
}

.tools button{
  margin-top:0;
  background:#111f30;
  color:white;
  border:1px solid #29425e;
  font-size:16px;
}

.answer{
  display:none;
  margin-top:20px;
  padding:22px;
  border-radius:22px;
  background:#f8fafc;
  color:#111827;
  text-align:left;
  font-size:18px;
  line-height:1.6;
  white-space:pre-wrap;
}

.hear{
  display:none;
  background:#101828;
  color:#20d9ff;
}

.status{
  min-height:25px;
  margin-top:12px;
  color:#8fa6bf;
  font-size:14px;
}

.footer{
  margin-top:25px;
  color:#65758a;
  font-size:13px;
}
</style>
</head>

<body>

<div class="app">

  <div class="logo">?</div>

  <h1>Ask <span>Away</span></h1>

  <div class="subtitle">
    Ask anything.<br>
    Get an answer.
  </div>

  <div class="card">

    <textarea id="question"
      placeholder="What would you like to know?"></textarea>

    <button id="micButton" class="mic">
      🎤 TAP TO TALK
    </button>

    <button id="askButton" class="ask">
      ASK AWAY →
    </button>

    <div id="status" class="status"></div>

    <div id="answer" class="answer"></div>

    <button id="hearButton" class="hear">
      🔊 READ ANSWER ALOUD
    </button>

    <div class="tools">
      <button id="showButton">👁 SHOW ME</button>
      <button id="howButton">💡 SHOW ME HOW</button>
    </div>

  </div>

  <div class="footer">
    Ask Away • Ask by voice or text
  </div>

</div>

<script>

const question = document.getElementById("question");
const ask = document.getElementById("askButton");
const answer = document.getElementById("answer");
const hear = document.getElementById("hearButton");
const mic = document.getElementById("micButton");
const status = document.getElementById("status");
const show = document.getElementById("showButton");
const how = document.getElementById("howButton");

let currentAnswer = "";

function speak(){
  if(!currentAnswer) return;

  speechSynthesis.cancel();

  const speech = new SpeechSynthesisUtterance(currentAnswer);
  speech.lang = "en-IE";
  speech.rate = 0.95;
  speech.pitch = 1;

  speechSynthesis.speak(speech);
}

async function askAway(extra=""){

  const q = question.value.trim();

  if(!q) return;

  ask.disabled = true;
  answer.style.display = "block";
  hear.style.display = "none";

  answer.textContent = "Thinking...";
  status.textContent = "Finding your answer...";

  try{

    const finalQuestion = extra
      ? q + "\n\n" + extra
      : q;

    const r = await fetch("/api/ask",{
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        question:finalQuestion
      })
    });

    const data = await r.json();

    if(!r.ok){
      throw new Error(data.error || "Something went wrong");
    }

    currentAnswer =
      data.answer ||
      data.message ||
      "I couldn't find an answer.";

    answer.textContent = currentAnswer;

    hear.style.display = "block";
    status.textContent = "Answer ready";

  }catch(e){

    answer.textContent =
      "Sorry, something went wrong. Please try again.";

    status.textContent = "Please try again.";

  }finally{

    ask.disabled = false;
  }
}

ask.onclick = () => askAway();

hear.onclick = speak;

show.onclick = () => {

  if(!question.value.trim()) return;

  askAway(
    "Give me a clear visual explanation where possible. Describe what I should look for or show me the important parts."
  );
};

how.onclick = () => {

  if(!question.value.trim()) return;

  askAway(
    "Explain how to do this step by step in simple language."
  );
};

question.addEventListener("keydown",function(e){

  if(e.key === "Enter" && !e.shiftKey){
    e.preventDefault();
    askAway();
  }

});

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;

if(SpeechRecognition){

  const recognition = new SpeechRecognition();

  recognition.lang = "en-IE";
  recognition.continuous = false;
  recognition.interimResults = false;

  recognition.onstart = () => {
    mic.textContent = "🎙 LISTENING...";
    status.textContent = "I'm listening...";
  };

  recognition.onresult = (e) => {

    const text =
      e.results[0][0].transcript;

    question.value = text;

    status.textContent = "Got it — ready to ask.";

  };

  recognition.onend = () => {
    mic.textContent = "🎤 TAP TO TALK";
  };

  recognition.onerror = () => {
    mic.textContent = "🎤 TAP TO TALK";
    status.textContent =
      "I couldn't hear that. Please try again.";
  };

  mic.onclick = () => {

    try{
      recognition.start();
    }catch(e){}
  };

}else{

  mic.style.display = "none";

}

if("serviceWorker" in navigator){

  window.addEventListener("load",() => {

    navigator.serviceWorker
      .register("/sw.js")
      .catch(() => {});

  });

}

</script>

</body>
</html>
