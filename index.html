<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#07111f">
<link rel="manifest" href="/manifest.json">
<title>Ask Away</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
min-height:100vh;
font-family:Arial,Helvetica,sans-serif;
background:radial-gradient(circle at top,#12345a 0%,#07111f 45%,#02060b 100%);
color:white;
display:flex;
justify-content:center;
align-items:flex-start;
}

.app{
width:100%;
max-width:650px;
min-height:100vh;
padding:28px 20px 40px;
text-align:center;
}

.logo{
width:105px;
height:105px;
margin:5px auto 18px;
border-radius:30px;
background:linear-gradient(145deg,#20d9ff,#5140ff);
display:flex;
align-items:center;
justify-content:center;
font-size:52px;
font-weight:900;
box-shadow:0 0 35px rgba(32,217,255,.35);
}

h1{
margin:0;
font-size:52px;
line-height:1;
font-weight:900;
letter-spacing:-2px;
}

h1 span{
color:#20d9ff;
}

.subtitle{
margin:16px auto 25px;
max-width:450px;
font-size:20px;
line-height:1.45;
color:#ebb0d0;
}

.card{
background:rgba(255,255,255,.07);
border:1px solid rgba(255,255,255,.13);
border-radius:28px;
padding:18px;
box-shadow:0 20px 45px rgba(0,0,0,.35);
backdrop-filter:blur(12px);
}

textarea{
width:100%;
height:170px;
resize:none;
border:2px solid rgba(255,255,255,.18);
border-radius:22px;
padding:20px;
background:#fff;
color:#111827;
font-size:20px;
outline:none;
font-family:Arial,Helvetica,sans-serif;
}

textarea:focus{
border-color:#20d9ff;
}

button{
width:100%;
border:0;
border-radius:18px;
padding:17px;
margin-top:13px;
font-size:19px;
font-weight:800;
cursor:pointer;
}

.ask{
background:#14283d;
color:#20d9ff;
border:1px solid #28506f;
}

.ask:disabled{
opacity:.6;
cursor:wait;
}

.status{
margin-top:14px;
font-size:14px;
color:#9fb3c8;
min-height:20px;
}

.answer{
display:none;
margin-top:20px;
padding:22px;
border-radius:22px;
background:#f8fafc;
color:#111827;
text-align:left;
font-size:18px;
line-height:1.6;
white-space:pre-wrap;
}

.answer.show{
display:block;
}

.answer-title{
font-weight:900;
color:#14283d;
margin-bottom:12px;
font-size:20px;
}

.tools{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
margin-top:12px;
}

.tools button{
margin-top:0;
background:#111f30;
color:white;
border:1px solid #29425e;
font-size:16px;
}

.main-tools{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
margin-top:12px;
}

.main-tools button{
margin-top:0;
}

.history-section{
display:none;
margin-top:20px;
text-align:left;
}

.history-section.show{
display:block;
}

.history-header{
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
margin-bottom:12px;
}

.history-title{
font-size:21px;
font-weight:900;
}

.clear-history{
width:auto;
margin:0;
padding:10px 14px;
font-size:13px;
background:#31151b;
color:#ffb5bd;
border:1px solid #69303a;
}

.history-item{
background:#f8fafc;
color:#111827;
border-radius:18px;
padding:16px;
margin-top:12px;
}

.history-question{
font-weight:900;
font-size:16px;
margin-bottom:9px;
}

.history-answer{
font-size:15px;
line-height:1.5;
white-space:pre-wrap;
}

.history-date{
margin-top:10px;
font-size:12px;
color:#718096;
}

.empty-history{
color:#9fb3c8;
text-align:center;
padding:18px 5px;
}

.footer{
margin-top:22px;
font-size:13px;
color:#718096;
}
</style>
</head>

<body>

<div class="app">

<div class="logo">?</div>

<h1>Ask <span>Away</span></h1>

<div class="subtitle">
Ask anything. Get clear answers.
</div>

<div class="card">

<textarea
id="question"
placeholder="What would you like to ask?"
></textarea>

<button class="ask" id="askButton" type="button">
ASK AWAY
</button>

<div class="status" id="status"></div>

<div class="answer" id="answer">

<div class="answer-title">
Answer
