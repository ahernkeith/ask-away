<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#07111f">
<link rel="manifest" href="/manifest.json">
<title>Ask Away</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
min-height:100vh;
font-family:Arial,Helvetica,sans-serif;
background:radial-gradient(circle at top,#12345a 0%,#07111f 45%,#02060b 100%);
color:white;
display:flex;
justify-content:center;
align-items:center;
}

.app{
width:100%;
max-width:650px;
min-height:100vh;
padding:28px 20px 35px;
text-align:center;
}

.logo{
width:105px;
height:105px;
margin:5px auto 18px;
border-radius:30px;
background:linear-gradient(145deg,#20d9ff,#5140ff);
display:flex;
align-items:center;
justify-content:center;
font-size:52px;
font-weight:900;
box-shadow:0 0 35px rgba(32,217,255,.35);
}

h1{
margin:0;
font-size:52px;
line-height:1;
font-weight:900;
letter-spacing:-2px;
}

h1 span{
color:#20d9ff;
}

.subtitle{
margin:16px auto 25px;
max-width:450px;
font-size:20px;
line-height:1.45;
color:#ebb0d0;
}

.card{
background:rgba(255,255,255,.07);
border:1px solid rgba(255,255,255,.13);
border-radius:28px;
padding:18px;
box-shadow:0 20px 45px rgba(0,0,0,.35);
backdrop-filter:blur(12px);
}

textarea{
width:100%;
height:170px;
resize:none;
border:2px solid rgba(255,255,255,.18);
border-radius:22px;
padding:20px;
background:#fff;
color:#111827;
font-size:20px;
outline:none;
}

textarea:focus{
border-color:#20d9ff;
}

button{
width:100%;
border:0;
border-radius:18px;
padding:17px;
margin-top:13px;
font-size:19px;
font-weight:800;
cursor:pointer;
}

.ask{
background:#14283d;
color:#20d9ff;
border:1px solid #28506f;
transition:transform .2s,box-shadow .2s,border-color .2s;
}

.ask:hover{
transform:translateY(-2px);
box-shadow:0 0 20px rgba(32,217,255,.25);
border-color:#20d9ff;
}

.mic{
margin:12px auto;
width:58px;
height:58px;
padding:0;
border-radius:50%;
background:#07111f;
color:#20d9ff;
border:2px solid #20d9ff;
font-size:24px;
display:flex;
align-items:center;
justify-content:center;
}

.mic.listening{
animation:pulse 1.2s infinite;
}

@keyframes pulse{
0%{box-shadow:0 0 0 0 rgba(32,217,255,.35)}
50%{box-shadow:0 0 0 15px rgba(32,217,255,.04)}
100%{box-shadow:0 0 0 0 rgba(32,217,255,0)}
}

.answer{
display:none;
margin-top:20px;
padding:22px;
border-radius:22px;
background:#f8fafc;
color:#111827;
text-align:left;
font-size:18px;
line-height:1.6;
white-space:pre-wrap;
box-shadow:0 10px 30px rgba(0,0,0,.15);
}

.answer.show{
display:block;
}

.answer-title{
font-weight:900;
color:#14283d;
margin-bottom:10px;
font-size:18px;
}

.tools{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
margin-top:12px;
}

.tools button{
margin-top:0;
background:#111f30;
color:white;
border:1px solid #29425e;
font-size:16px;
}

.status{
margin-top:14px;
font-size:14px;
color:#9fb3c8;
min-height:20px;
}

.footer{
margin-top:22px;
font-size:13px;
color:#718096;
}
</style>
</head>

<body>

<div class="app">

<div class="logo">?</div>

<h1>Ask <span>Away</span></h1>

<div class="subtitle">
Ask anything. Get clear answers.
</div>

<div class="card">

<textarea id="question" placeholder="What would you like to ask?"></textarea>

<button class="mic" id="micButton" type="button">🎙️</button>

<button class="ask" id="askButton" type="button">
ASK AWAY
</button>

<div class="status" id="status"></div>

<div class="answer" id="answer">
<div class="answer-title">Answer</div>
<div id="answerText"></div>
</div>

<div class="tools">
<button id="speakButton" type="button">🔊 Read Answer</button>
<button id="clearButton" type="button">✕ Clear</button>
</div>

</div>

<div class="footer">
Ask Away — your AI assistant
</div>

</div>

<script>
const questionBox = document.getElementById("question");
const askButton = document.getElementById("askButton");
const micButton = document.getElementById("micButton");
const answerBox = document.getElementById("answer");
const answerText = document.getElementById("answerText");
const statusBox = document.getElementById("status");
const speakButton = document.getElementById("speakButton");
const clearButton = document.getElementById("clearButton");

let recognition = null;

function setStatus(message){
statusBox.textContent = message;
}

function speakAnswer(){

const text = answerText.textContent.trim();

if(!text){
return;
}

if(!("speechSynthesis" in window)){
return;
}

speechSynthesis.cancel();

const speech = new SpeechSynthesisUtterance(text);

speech.lang = "en-IE";
speech.rate = 1;
speech.pitch = 1;

speechSynthesis.speak(speech);

}

async function askAway(){

const question = questionBox.value.trim();

if(!question){
setStatus("Please type a question first.");
questionBox.focus();
return;
}

askButton.disabled = true;
askButton.textContent = "THINKING...";
setStatus("Thinking...");

answerBox.classList.remove("show");
answerText.textContent = "";

try{

const response = await fetch("/api/ask",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
question:question
})
});

if(!response.ok){
throw new Error("Request failed");
}

const data = await response.json();

const answer =
data.answer ||
data.response ||
data.message ||
"No answer was returned.";

answerText.textContent = answer;
answerBox.classList.add("show");

setStatus("Ready.");

speakAnswer();

}catch(error){

console.error(error);

answerText.textContent =
"Sorry, I couldn't connect to Ask Away right now. Please try again.";

answerBox.classList.add("show");

setStatus("Connection problem.");

}finally{

askButton.disabled = false;
askButton.textContent = "ASK AWAY";

}

}

askButton.addEventListener("click",askAway);

questionBox.addEventListener("keydown",function(event){

if(event.key==="Enter" && !event.shiftKey){
event.preventDefault();
askAway();
}

});

speakButton.addEventListener("click",function(){

speakAnswer();

});

clearButton.addEventListener("click",function(){

speechSynthesis.cancel();

questionBox.value="";
answerText.textContent="";
answerBox.classList.remove("show");
setStatus("");
questionBox.focus();

});

function startVoice(){

const SpeechRecognition =
window.SpeechRecognition ||
window.webkitSpeechRecognition;

if(!SpeechRecognition){

setStatus("Voice input is not supported in this browser.");
return;

}

if(recognition){
recognition.stop();
return;
}

recognition=new SpeechRecognition();

recognition.lang="en-IE";
recognition.continuous=false;
recognition.interimResults=false;

recognition.onstart=function(){

micButton.classList.add("listening");
micButton.textContent="🔴";
setStatus("Listening...");

};

recognition.onresult=function(event){

const transcript=event.results[0][0].transcript;

questionBox.value=transcript;

setStatus("Voice captured.");

};

recognition.onerror=function(event){

console.log(event.error);

setStatus("Microphone error: "+event.error);

};

recognition.onend=function(){

micButton.classList.remove("listening");
micButton.textContent="🎙️";
recognition=null;

};

recognition.start();

}

micButton.addEventListener("click",startVoice);

if("serviceWorker" in navigator){

window.addEventListener("load",function(){

navigator.serviceWorker.register("/service-worker.js")
.then(function(){
console.log("Service worker registered");
})
.catch(function(error){
console.log("Service worker registration failed:",error);
});

});

}

</script>

</body>
</html>
