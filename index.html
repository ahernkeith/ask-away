<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ask Away</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Arial;background:linear-gradient(135deg,#173b91,#245be8,#7130df);display:flex;justify-content:center;align-items:center;padding:15px}
.container{width:100%;max-width:640px;background:white;border-radius:35px;padding:35px 25px;text-align:center;box-shadow:0 15px 45px #0004}
.logo{width:120px;height:120px;margin:auto;border-radius:30px;background:linear-gradient(135deg,#2868ed,#7130df);color:white;font-size:75px;font-weight:bold;display:flex;align-items:center;justify-content:center}
h1{font-size:55px;margin:20px 0 10px;color:#101828}
.subtitle{font-size:23px;color:#707887;margin-bottom:30px}
textarea{width:100%;height:210px;padding:25px;border:3px solid #ddd;border-radius:28px;font-size:23px;resize:vertical;outline:none}
button{width:100%;border:0;border-radius:28px;padding:23px;margin-top:18px;font-size:27px;font-weight:bold}
.speak{background:#eef1ff;color:#3636a0}
.ask{background:linear-gradient(135deg,#2868ed,#7130df);color:white}
.hear{background:#101828;color:white}
.answer{margin-top:30px;padding:28px;background:#f5f6f9;border-radius:28px;text-align:left;font-size:24px;line-height:1.5}
.footer{margin-top:25px;color:#999}
</style>
</head>
<body>
<div class="container">
<div class="logo">?</div>
<h1>Ask Away</h1>
<div class="subtitle">Ask anything. Get an answer.</div>
<textarea id="question" placeholder="What would you like to know?"></textarea>
<button id="micButton" class="speak">🎤 Speak</button>
<button id="askButton" class="ask">Ask Away →</button>
<div id="answer" class="answer" style="display:none"></div>
<button id="hearButton" class="hear" style="display:none">🔊 Hear Answer</button>
<div class="footer">Powered by AI</div>
</div>
<script>
const question=document.getElementById("question");
const ask=document.getElementById("askButton");
const answer=document.getElementById("answer");
const hear=document.getElementById("hearButton");
const mic=document.getElementById("micButton");
let currentAnswer="";

function speak(){
if(!currentAnswer)return;
speechSynthesis.cancel();
speechSynthesis.speak(new SpeechSynthesisUtterance(currentAnswer));
}

ask.onclick=async()=>{
const q=question.value.trim();
if(!q)return;
ask.disabled=true;
ask.textContent="Thinking...";
answer.style.display="block";
answer.textContent="Thinking...";
hear.style.display="none";
try{
const r=await fetch("/api/ask",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({question:q})});
const data=await r.json();
if(!r.ok)throw new Error(data.error);
currcurrentAnswer=(data.answer||"I didn't receive an answer.").replace(/\*/g,"");
answer.textContent=currentAnswer;
hear.style.display="block";
speak();
}catch(e){
answer.textContent="Sorry, something went wrong. Please try again.";
}
ask.disabled=false;
ask.textContent="Ask Away →";
};

hear.onclick=speak;

const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
if(SpeechRecognition){
const recognition=new SpeechRecognition();
recognition.lang="en-IE";
recognition.onstart=()=>mic.textContent="🎤 Listening...";
recognition.onresult=e=>question.value=e.results[0][0].transcript;
recognition.onend=()=>mic.textContent="🎤 Speak";
recognition.onerror=()=>mic.textContent="🎤 Speak";
mic.onclick=()=>recognition.start();
}else{
mic.style.display="none";
}
</script>
</body>
</html>
