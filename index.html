<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ask Away</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f2f2f2;
  margin: 0;
  padding: 20px;
  text-align: center;
}

.container {
  max-width: 600px;
  margin: auto;
  background: white;
  padding: 25px;
  border-radius: 20px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.15);
}

h1 {
  font-size: 42px;
  margin-bottom: 5px;
}

p {
  color: #666;
}

textarea {
  width: 100%;
  height: 120px;
  box-sizing: border-box;
  padding: 15px;
  font-size: 18px;
  border: 1px solid #ccc;
  border-radius: 12px;
  margin-top: 15px;
}

button {
  border: none;
  border-radius: 12px;
  padding: 14px 20px;
  margin: 10px 5px;
  font-size: 17px;
  cursor: pointer;
}

#askButton {
  background: #111;
  color: white;
}

#micButton {
  background: #ddd;
}

#answer {
  margin-top: 20px;
  padding: 15px;
  background: #f5f5f5;
  border-radius: 12px;
  text-align: left;
  white-space: pre-wrap;
  min-height: 30px;
}
</style>
</head>

<body>

<div class="container">

<h1>Ask Away</h1>

<p>Ask anything by text or voice.</p>

<textarea id="question" placeholder="Type your question here..."></textarea>

<br>

<button id="micButton">🎤 Speak</button>

<button id="askButton">Ask Away</button>

<div id="answer">Your answer will appear here.</div>

</div>

<script>

const questionBox = document.getElementById("question");
const answerBox = document.getElementById("answer");
const askButton = document.getElementById("askButton");
const micButton = document.getElementById("micButton");

askButton.addEventListener("click", async () => {

  const question = questionBox.value.trim();

  if (!question) {
    answerBox.textContent = "Please enter a question.";
    return;
  }

  answerBox.textContent = "Thinking...";

  try {

    const response = await fetch("/api/ask", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        question: question
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "Something went wrong.");
    }

    answerBox.textContent = data.answer || "I didn't receive an answer.";

  } catch (error) {

    answerBox.textContent = "Error: " + error.message;

  }

});

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;

if (SpeechRecognition) {

  const recognition = new SpeechRecognition();

  recognition.lang = "en-IE";
  recognition.continuous = false;
  recognition.interimResults = false;

  micButton.addEventListener("click", () => {

    micButton.textContent = "🎤 Listening...";

    recognition.start();

  });

  recognition.onresult = (event) => {

    questionBox.value =
      event.results[0][0].transcript;

    micButton.textContent = "🎤 Speak";

  };

  recognition.onerror = () => {

    micButton.textContent = "🎤 Speak";

  };

  recognition.onend = () => {

    micButton.textContent = "🎤 Speak";

  };

} else {

  micButton.style.display = "none";

}

</script>

</body>
</html>
