<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ask Away</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #111827, #2563eb);
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.container {
  width: 100%;
  max-width: 600px;
  background: rgba(255, 255, 255, 0.97);
  border-radius: 32px;
  padding: 35px 25px;
  box-shadow: 0 25px 60px rgba(0, 0, 0, 0.3);
}

.logo {
  width: 80px;
  height: 80px;
  margin: 0 auto 15px;
  border-radius: 24px;
  background: linear-gradient(135deg, #2563eb, #7c3aed);
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 42px;
  font-weight: bold;
  box-shadow: 0 10px 25px rgba(37, 99, 235, 0.3);
}

h1 {
  text-align: center;
  font-size: 52px;
  margin: 5px 0;
  color: #111827;
  letter-spacing: -2px;
}

.subtitle {
  text-align: center;
  color: #6b7280;
  font-size: 20px;
  margin-bottom: 30px;
}

textarea {
  width: 100%;
  min-height: 170px;
  padding: 20px;
  border: 2px solid #e5e7eb;
  border-radius: 22px;
  font-size: 21px;
  font-family: Arial, sans-serif;
  resize: vertical;
  outline: none;
  transition: 0.2s;
}

textarea:focus {
  border-color: #2563eb;
  box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
}

.buttons {
  display: flex;
  gap: 12px;
  margin-top: 18px;
}

button {
  border: none;
  cursor: pointer;
  font-size: 20px;
  font-weight: bold;
  border-radius: 18px;
  padding: 17px 20px;
  transition: transform 0.15s, opacity 0.15s;
}

button:active {
  transform: scale(0.97);
}

#micButton {
  flex: 1;
  background: #eef2ff;
  color: #3730a3;
}

#askButton {
  width: 100%;
  margin-top: 14px;
  background: linear-gradient(135deg, #2563eb, #7c3aed);
  color: white;
  box-shadow: 0 8px 20px rgba(37, 99, 235, 0.25);
}

#answer {
  margin-top: 28px;
  padding: 22px;
  background: #f8fafc;
  border: 1px solid #e5e7eb;
  border-radius: 22px;
  color: #111827;
  font-size: 20px;
  line-height: 1.6;
  min-height: 60px;
  text-align: left;
  white-space: pre-wrap;
}

.loading {
  opacity: 0.6;
}

.footer {
  text-align: center;
  color: #9ca3af;
  font-size: 14px;
  margin-top: 25px;
}

@media (max-width: 600px) {

  body {
    padding: 12px;
  }

  .container {
    padding: 28px 18px;
    border-radius: 28px;
  }

  h1 {
    font-size: 46px;
  }

  .subtitle {
    font-size: 18px;
  }

  textarea {
    font-size: 20px;
  }

  button {
    font-size: 18px;
  }

  #answer {
    font-size: 19px;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="logo">?</div>

  <h1>Ask Away</h1>

  <div class="subtitle">
    Ask anything. Get an answer.
  </div>

  <textarea
    id="question"
    placeholder="What would you like to know?"
  ></textarea>

  <div class="buttons">
    <button id="micButton">🎤 Speak</button>
  </div>

  <button id="askButton">Ask Away →</button>

  <div id="answer">
    Your answer will appear here.
  </div>

  <div class="footer">
    Powered by AI
  </div>

</div>

<script>

const questionBox = document.getElementById("question");
const askButton = document.getElementById("askButton");
const answerBox = document.getElementById("answer");
const micButton = document.getElementById("micButton");

askButton.addEventListener("click", async () => {

  const question = questionBox.value.trim();

  if (!question) {
    answerBox.textContent = "Please enter a question.";
    return;
  }

  answerBox.textContent = "Thinking...";
  answerBox.classList.add("loading");

  try {

    const response = await fetch("/api/ask", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        question: question
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "Something went wrong.");
    }

    let answer = data.answer || "I didn't receive an answer.";

    answer = answer.replace(/\*\*(.*?)\*\*/g, "$1");

    answerBox.textContent = answer;

  } catch (error) {

    answerBox.textContent =
      "Sorry, something went wrong. Please try again.";

  } finally {

    answerBox.classList.remove("loading");

  }

});


const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;

if (SpeechRecognition) {

  const recognition = new SpeechRecognition();

  recognition.lang = "en-IE";
  recognition.continuous = false;
  recognition.interimResults = false;

  micButton.addEventListener("click", () => {

    recognition.start();

    micButton.textContent = "🎙️ Listening...";

  });

  recognition.onresult = (event) => {

    const transcript =
      event.results[0][0].transcript;

    questionBox.value = transcript;

    micButton.textContent = "🎤 Speak";

  };

  recognition.onerror = () => {

    micButton.textContent = "🎤 Speak";

  };

  recognition.onend = () => {

    micButton.textContent = "🎤 Speak";

  };

} else {

  micButton.style.display = "none";

}

</script>

</body>
</html>
