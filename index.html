<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ask Away</title>
<link rel="manifest" href="/manifest.json">

<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif}
body{
  background:
    radial-gradient(circle at top left,#193b70 0%,transparent 38%),
    radial-gradient(circle at bottom right,#173e6e 0%,transparent 40%),
    linear-gradient(145deg,#050b18,#0a1426 55%,#07101d);
  color:white;padding:20px
}
.container{width:100%;max-width:520px;margin:0 auto;padding:10px 0 30px}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
.brand{display:flex;align-items:center;gap:12px}
.brand img{width:58px;height:58px;border-radius:16px;box-shadow:0 0 25px rgba(0,210,255,.35)}
.brand-name{font-size:22px;font-weight:800;letter-spacing:.3px}
.status{
  font-size:12px;color:#73f5a4;background:rgba(60,255,150,.08);
  border:1px solid rgba(60,255,150,.2);padding:7px 10px;border-radius:20px
}
.hero{text-align:center;padding:18px 5px 25px}
.hero img{
  width:145px;height:145px;border-radius:38px;
  box-shadow:0 0 35px rgba(0,210,255,.35),0 20px 45px rgba(0,0,0,.45)
}
h1{margin:22px 0 8px;font-size:48px;line-height:1;font-weight:900;letter-spacing:-2px}
h1 span{color:#20d9ff}
.subtitle{margin:0 auto;max-width:380px;font-size:18px;line-height:1.5;color:#aebbd0}
.card{
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);
  border-radius:28px;padding:18px;box-shadow:0 20px 50px rgba(0,0,0,.3);
  backdrop-filter:blur(12px)
}
.label{font-size:13px;font-weight:700;color:#7fe8ff;margin:2px 5px 10px;text-transform:uppercase;letter-spacing:1px}
textarea{
  width:100%;min-height:145px;resize:vertical;border:1px solid rgba(255,255,255,.12);
  border-radius:20px;background:rgba(0,0,0,.25);color:white;padding:18px;
  font-size:19px;line-height:1.4;outline:none
}
textarea::placeholder{color:#8290a5}
textarea:focus{border-color:#20d9ff;box-shadow:0 0 0 3px rgba(32,217,255,.1)}
.buttons{display:grid;grid-template-columns:1fr 1.5fr;gap:12px;margin-top:14px}
button{border:0;border-radius:18px;padding:17px 12px;font-size:17px;font-weight:800;cursor:pointer;transition:.2s}
button:active{transform:scale(.97)}
.mic{background:#16243a;color:white;border:1px solid rgba(255,255,255,.12)}
.ask{background:linear-gradient(135deg,#08cfff,#147cff);color:white;box-shadow:0 8px 25px rgba(0,150,255,.3)}
button:disabled{opacity:.55}
.answer{
  display:none;margin-top:18px;background:rgba(255,255,255,.07);
  border:1px solid rgba(32,217,255,.18);border-radius:24px;padding:20px
}
.answer-title{color:#20d9ff;font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:1px;margin-bottom:12px}
#answerText{color:#eef5ff;font-size:17px;line-height:1.6;white-space:pre-wrap}
.hear{
  display:none;width:100%;margin-top:14px;background:#111d30;color:#7fe8ff;
  border:1px solid rgba(32,217,255,.2)
}
.features{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px}
.feature{text-align:center;padding:15px 8px;border-radius:18px;background:rgba(255,255,255,.045);color:#aebbd0;font-size:12px}
.feature-icon{font-size:25px;margin-bottom:7px}
.footer{text-align:center;color:#66758b;font-size:12px;margin-top:25px}
@media(max-width:380px){
  h1{font-size:42px}
  .hero img{width:125px;height:125px}
  textarea{font-size:17px}
}
</style>
</head>

<body>
<div class="container">

  <div class="topbar">
    <div class="brand">
      <img src="/ask-away-icon-192.png" alt="Ask Away">
      <div class="brand-name">Ask Away</div>
    </div>
    <div class="status">● ONLINE</div>
  </div>

  <div class="hero">
    <img src="/ask-away-icon-512.png" alt="Ask Away AI">
    <h1>Ask <span>Away</span></h1>
    <p class="subtitle">Ask anything. Get an answer.<br>By text or by voice.</p>
  </div>

  <div class="card">
    <div class="label">What would you like to know?</div>

    <textarea id="question" placeholder="Type your question here..."></textarea>

    <div class="buttons">
      <button id="micButton" class="mic">🎙️ Voice</button>
      <button id="askButton" class="ask">✨ Ask Away</button>
    </div>

    <div id="answer" class="answer">
      <div class="answer-title">💡 Answer</div>
      <div id="answerText"></div>
    </div>

    <button id="hearButton" class="hear">🔊 Hear Answer</button>
  </div>

  <div class="features">
    <div class="feature"><div class="feature-icon">🎤</div>Voice</div>
    <div class="feature"><div class="feature-icon">⚡</div>Fast</div>
    <div class="feature"><div class="feature-icon">💡</div>Answers</div>
  </div>

  <div class="footer">Ask Away • Your AI assistant</div>
</div>

<script>
const question=document.getElementById("question");
const ask=document.getElementById("askButton");
const answer=document.getElementById("answer");
const answerText=document.getElementById("answerText");
const hear=document.getElementById("hearButton");
const mic=document.getElementById("micButton");

let currentAnswer="";

function speak(){
  if(!currentAnswer)return;
  speechSynthesis.cancel();
  const speech=new SpeechSynthesisUtterance(currentAnswer);
  speech.rate=1;
  speech.pitch=1;
  speechSynthesis.speak(speech);
}

ask.onclick=async()=>{
  const q=question.value.trim();
  if(!q)return;

  ask.disabled=true;
  ask.textContent="Thinking...";
  answer.style.display="block";
  answerText.textContent="Thinking...";
  hear.style.display="none";

  try{
    const r=await fetch("/api/ask",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({question:q})
    });

    const data=await r.json();

    if(!r.ok)throw new Error(data.error||"Something went wrong");

    currentAnswer=data.answer||"I couldn't find an answer.";
    answerText.textContent=currentAnswer;
    hear.style.display="block";
  }catch(e){
    answerText.textContent="Sorry, something went wrong. Please try again.";
  }

  ask.disabled=false;
  ask.textContent="✨ Ask Away";
};

hear.onclick=speak;

const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;

if(SpeechRecognition){
  const recognition=new SpeechRecognition();
  recognition.lang="en-IE";
  recognition.interimResults=false;
  recognition.continuous=false;

  recognition.onstart=()=>{mic.textContent="🔴 Listening..."};

  recognition.onresult=event=>{
    const text=event.results[0][0].transcript;
    question.value=text;
    ask.click();
  };

  recognition.onend=()=>{mic.textContent="🎙️ Voice"};
  recognition.onerror=()=>{mic.textContent="🎙️ Voice"};

  mic.onclick=()=>{recognition.start()};
}else{
  mic.style.display="none";
}

if("serviceWorker" in navigator){
  navigator.serviceWorker.register("/sw.js").catch(()=>{});
}
</script>
</body>
</html>
